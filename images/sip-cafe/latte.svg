<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t2">Illustrated layered latte in a glass next to a croissant</title>
  <defs>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="0.18" stop-color="#fbf7ef"/>
      <stop offset="0.22" stop-color="#ead5b5"/>
      <stop offset="0.6" stop-color="#c9955f"/>
      <stop offset="0.75" stop-color="#7a4527"/>
      <stop offset="1" stop-color="#5a311b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f5cfc6"/>
  <circle cx="400" cy="270" r="210" fill="#fbe7df"/>
  <!-- leaves -->
  <g fill="#9bb89a">
    <path d="M90 140Q150 100 170 170Q110 190 90 140Z"/><path d="M120 230Q180 210 190 270Q130 285 120 230Z"/>
    <path d="M700 120Q640 90 625 160Q690 170 700 120Z"/>
  </g>
  <!-- table -->
  <rect y="450" width="800" height="150" fill="#1e5a5a"/>
  <rect y="450" width="800" height="12" fill="#2a7070"/>
  <!-- coaster -->
  <ellipse cx="400" cy="455" rx="100" ry="14" fill="#c89b6d"/>
  <!-- glass -->
  <path d="M320 170L338 450H462L480 170Z" fill="url(#coffee)"/>
  <path d="M320 170L338 450H462L480 170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
  <ellipse cx="400" cy="170" rx="80" ry="10" fill="#fff" opacity="0.9"/>
  <path d="M340 200L352 420" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  <!-- steam -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M370 150Q355 125 370 100T370 55"/><path d="M405 145Q420 118 405 92T405 45"/><path d="M438 150Q425 128 438 105"/>
  </g>
  <!-- croissant -->
  <g transform="translate(610 445)">
    <path d="M-95 5Q-85 -80 0 -80Q85 -80 95 5Q70 -30 0 -32Q-70 -30 -95 5Z" fill="#e0b04a"/>
    <path d="M-55 -30Q-50 -65 -30 -76M0 -32V-80M55 -30Q50 -65 30 -76" stroke="#b9852a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- spoon -->
