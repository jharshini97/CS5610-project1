    <path d="M575 510V545M575 510H590V490M665 510V545M665 510H650V490" fill="none" stroke="#1e5a5a" stroke-width="4"/>
    <rect x="612" y="496" width="10" height="12" rx="2" fill="#fbf7ef"/>
