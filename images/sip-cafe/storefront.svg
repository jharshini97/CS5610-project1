  <g fill="#f2a9a0">
    <circle cx="40" cy="560" r="6"/><circle cx="60" cy="575" r="5"/><circle cx="85" cy="558" r="6"/>
    <circle cx="720" cy="565" r="6"/><circle cx="745" cy="580" r="5"/><circle cx="770" cy="560" r="6"/>
  </g>
  <g fill="#e0b04a">
    <circle cx="50" cy="585" r="4"/><circle cx="735" cy="548" r="4"/><circle cx="760" cy="590" r="4"/>
