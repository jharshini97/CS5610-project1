    <rect x="696" y="360" width="10" height="110" fill="#6b4a2e"/>
    <circle cx="700" cy="335" r="66" fill="#5e8f5a"/><circle cx="745" cy="370" r="40" fill="#6fa36a"/>
  </g>
  <!-- lawn + path -->
  <path d="M0 450Q400 425 800 450V600H0Z" fill="#8fc07f"/>
  <path d="M330 600L370 470H430L470 600Z" fill="#e9dcc3"/>
  <!-- pergola -->
  <g transform="translate(40 0)">
  <g stroke="#1e5a5a" stroke-width="8">
    <path d="M555 330V470M640 330V470"/>
    <path d="M540 330H660M540 345H660" stroke-width="6"/>
  </g>
  <g fill="#4e8a55">
    <circle cx="560" cy="325" r="14"/><circle cx="585" cy="318" r="12"/><circle cx="610" cy="326" r="15"/><circle cx="640" cy="320" r="12"/>
    <circle cx="555" cy="360" r="8"/><circle cx="640" cy="375" r="9"/><circle cx="555" cy="395" r="7"/>
  </g>
  </g>
  <!-- pavilion -->
  <path d="M225 285L400 215L575 285Z" fill="#5f9e8f"/>
  <path d="M225 285L400 215L575 285" fill="none" stroke="#1e5a5a" stroke-width="6" stroke-linejoin="round"/>
  <rect x="240" y="285" width="320" height="30" fill="#1e5a5a"/>
  <text x="400" y="307" text-anchor="middle" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4" fill="#fbf7ef">sip café</text>
  <rect x="250" y="315" width="300" height="150" fill="url(#pane)"/>
  <!-- inside: counter + barista -->
  <circle cx="330" cy="365" r="14" fill="#1e5a5a" opacity="0.55"/>
  <rect x="314" y="378" width="32" height="40" rx="10" fill="#1e5a5a" opacity="0.55"/>
  <rect x="250" y="410" width="300" height="55" fill="#c89b6d" opacity="0.85"/>
  <rect x="440" y="378" width="60" height="32" rx="6" fill="#9bb89a"/>
  <path d="M310 315V465M370 315V465M430 315V465M490 315V465" stroke="#1e5a5a" stroke-width="4"/>
  <rect x="250" y="315" width="300" height="150" fill="none" stroke="#1e5a5a" stroke-width="6"/>
  <!-- bistro tables -->
  <g>
    <path d="M170 380V500" stroke="#2e3436" stroke-width="4"/>
    <path d="M110 390Q170 340 230 390Z" fill="#e0b04a"/>
    <ellipse cx="170" cy="500" rx="30" ry="7" fill="#2e3436"/>
    <path d="M170 500V525M150 525H190" stroke="#2e3436" stroke-width="4"/>
    <path d="M125 500V530M125 500H140V480M215 500V530M215 500H200V480" fill="none" stroke="#1e5a5a" stroke-width="4"/>
    <ellipse cx="620" cy="510" rx="30" ry="7" fill="#2e3436"/>
