    <rect x="610" y="130" width="80" height="340"/><rect x="700" y="170" width="90" height="300"/>
    <rect x="200" y="180" width="60" height="290"/><rect x="540" y="190" width="60" height="280"/>
  </g>
  <g fill="#dbe9ee">
