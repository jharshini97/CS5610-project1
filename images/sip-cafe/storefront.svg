<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t1">Illustrated glass pavilion of Sip Cafe in a city park</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3e6"/>
      <stop offset="1" stop-color="#e6f4f7"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#f3d38a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="140" cy="80" rx="60" ry="18"/><ellipse cx="180" cy="68" rx="40" ry="20"/>
    <ellipse cx="620" cy="60" rx="70" ry="16"/><ellipse cx="590" cy="50" rx="36" ry="16"/>
  </g>
  <!-- city skyline -->
  <g fill="#c8dce3">
