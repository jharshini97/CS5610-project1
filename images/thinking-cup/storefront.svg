<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t1">Illustrated storefront of Thinking Cup</title>
  <defs>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#55606b"/>
      <path d="M0 0H40M0 10H40M0 20H40M10 0V10M30 10V20" stroke="#4a545e" stroke-width="2"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf7e"/>
      <stop offset="1" stop-color="#d99a45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#c9d4d8"/>
  <rect x="60" y="40" width="680" height="480" fill="url(#brick)"/>
  <rect x="60" y="30" width="680" height="16" fill="#3a3f42"/>
  <!-- sign -->
  <rect x="110" y="70" width="580" height="100" rx="4" fill="#1d2a44" stroke="#b08d4a" stroke-width="5"/>
  <text x="400" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" letter-spacing="5" fill="#f1e9d6">THINKING CUP</text>
  <text x="400" y="156" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#c9a861">Coffee House</text>
  <!-- awning -->
  <path d="M90 200H710L690 250H110Z" fill="#1d2a44"/>
  <g fill="#e8dcc0">
    <path d="M150 200H210L205 250H146Z"/><path d="M270 200H330L327 250H266Z"/>
    <path d="M390 200H450L449 250H386Z"/><path d="M510 200H570L571 250H506Z"/>
    <path d="M630 200H690L693 250H626Z"/>
  </g>
  <!-- window -->
  <rect x="110" y="260" width="360" height="220" fill="url(#glow)" stroke="#2b2b2b" stroke-width="8"/>
  <path d="M230 260V480M350 260V480M110 370H470" stroke="#2b2b2b" stroke-width="5"/>
  <g fill="#8a5a33" opacity="0.55">
    <circle cx="170" cy="345" r="14"/><rect x="152" y="359" width="36" height="40" rx="8"/>
    <circle cx="410" cy="340" r="13"/><rect x="393" y="353" width="34" height="42" rx="8"/>
  </g>
  <g fill="#3a2a1d"><rect x="130" y="440" width="320" height="10"/></g>
  <!-- door -->
  <rect x="520" y="270" width="150" height="210" fill="#1d2a44" stroke="#2b2b2b" stroke-width="6"/>
  <rect x="540" y="290" width="110" height="110" fill="url(#glow)"/>
  <circle cx="650" cy="420" r="7" fill="#c9a861"/>
  <text x="595" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1d2a44">OPEN</text>
  <!-- sidewalk -->
  <rect y="520" width="800" height="80" fill="#8e9599"/>
  <path d="M0 540H800" stroke="#7a8185" stroke-width="3"/>
  <!-- planters -->
  <g>
    <rect x="80" y="485" width="40" height="38" fill="#4a4f52"/>
    <circle cx="100" cy="470" r="24" fill="#5d7f4e"/>
    <rect x="690" y="485" width="40" height="38" fill="#4a4f52"/>
    <circle cx="710" cy="470" r="24" fill="#5d7f4e"/>
  </g>
  <!-- chalkboard -->
  <path d="M430 520L455 440H505L530 520" fill="none" stroke="#6b4a2e" stroke-width="6"/>
  <rect x="452" y="445" width="56" height="60" fill="#263029" stroke="#6b4a2e" stroke-width="4"/>
  <path d="M462 462H498M462 476H492M462 490H496" stroke="#e8dcc0" stroke-width="2"/>
</svg>
