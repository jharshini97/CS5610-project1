      <rect x="312" y="98" width="16" height="42" fill="#7a3f22"/><rect x="330" y="106" width="11" height="34" fill="#e8dcc0"/>
      <rect x="360" y="102" width="15" height="38" fill="#5d7f4e"/><rect x="377" y="99" width="13" height="41" fill="#1d2a44"/>
