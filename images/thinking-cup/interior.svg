      <rect x="450" y="104" width="14" height="36" fill="#7a3f22"/><rect x="466" y="100" width="16" height="40" fill="#e8dcc0"/>
      <rect x="282" y="156" width="16" height="37" fill="#e8dcc0"/><rect x="300" y="152" width="13" height="41" fill="#5d7f4e"/>
      <rect x="315" y="158" width="14" height="35" fill="#1d2a44"/><circle cx="365" cy="178" r="14" fill="#8a9a8a"/><rect x="355" y="178" width="20" height="15" fill="#6b4a2e"/>
      <rect x="400" y="154" width="15" height="39" fill="#b08d4a"/><rect x="417" y="150" width="13" height="43" fill="#7a3f22"/>
      <rect x="432" y="157" width="16" height="36" fill="#1d2a44"/><rect x="450" y="153" width="12" height="40" fill="#e8dcc0"/>
      <rect x="284" y="210" width="80" height="12" fill="#1d2a44"/><rect x="288" y="222" width="72" height="12" fill="#b08d4a"/><rect x="282" y="234" width="84" height="12" fill="#7a3f22"/>
      <rect x="420" y="208" width="14" height="38" fill="#5d7f4e"/><rect x="436" y="212" width="12" height="34" fill="#e8dcc0"/><rect x="450" y="206" width="15" height="40" fill="#1d2a44"/>
    </g>
