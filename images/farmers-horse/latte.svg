<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t2">Illustrated latte in an enamel mug on a gingham cloth with honey and wheat</title>
  <defs>
    <pattern id="gingham" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f4eee2"/>
      <rect width="20" height="40" fill="#7d8450" opacity="0.35"/>
      <rect width="40" height="20" fill="#7d8450" opacity="0.35"/>
    </pattern>
    <radialGradient id="foam" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7ead2"/>
      <stop offset="0.7" stop-color="#e8cfa6"/>
      <stop offset="1" stop-color="#b98450"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gingham)"/>
  <!-- wheat stalks -->
  <g stroke="#c9a358" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M40 600Q90 420 170 300"/><path d="M80 600Q120 440 220 340"/>
  </g>
  <g fill="#e2c58a">
    <ellipse cx="165" cy="310" rx="9" ry="16" transform="rotate(35 165 310)"/><ellipse cx="180" cy="292" rx="9" ry="16" transform="rotate(35 180 292)"/>
    <ellipse cx="150" cy="330" rx="9" ry="16" transform="rotate(35 150 330)"/><ellipse cx="215" cy="345" rx="9" ry="16" transform="rotate(45 215 345)"/>
    <ellipse cx="230" cy="330" rx="9" ry="16" transform="rotate(45 230 330)"/><ellipse cx="200" cy="362" rx="9" ry="16" transform="rotate(45 200 362)"/>
  </g>
  <!-- mug (top view) -->
  <ellipse cx="408" cy="312" rx="150" ry="150" fill="#000" opacity="0.15"/>
  <rect x="520" y="275" width="95" height="50" rx="25" fill="#f7f7f4" stroke="#2f4a6b" stroke-width="6"/>
  <circle cx="400" cy="300" r="150" fill="#f7f7f4"/>
  <circle cx="400" cy="300" r="150" fill="none" stroke="#2f4a6b" stroke-width="12"/>
  <circle cx="400" cy="300" r="126" fill="url(#foam)"/>
  <!-- cinnamon star + dusting -->
  <path d="M400 250L412 285L450 288L420 310L430 346L400 325L370 346L380 310L350 288L388 285Z" fill="#a0643a" opacity="0.75"/>
  <g fill="#a0643a" opacity="0.5">
    <circle cx="330" cy="260" r="2"/><circle cx="470" cy="250" r="2"/><circle cx="455" cy="360" r="2"/><circle cx="340" cy="350" r="2"/>
    <circle cx="300" cy="310" r="2"/><circle cx="500" cy="310" r="2"/><circle cx="380" cy="215" r="2"/><circle cx="420" cy="390" r="2"/>
  </g>
  <g fill="#5f7a99"><circle cx="280" cy="210" r="3"/><circle cx="525" cy="380" r="3"/><circle cx="290" cy="410" r="2.5"/></g>
  <!-- honey jar -->
  <g transform="translate(640 470)">
    <ellipse cx="0" cy="52" rx="62" ry="12" fill="#000" opacity="0.12"/>
    <rect x="-55" y="-40" width="110" height="90" rx="22" fill="#e8a53a" opacity="0.9"/>
    <rect x="-45" y="-60" width="90" height="22" rx="4" fill="#d9795f"/>
    <rect x="-38" y="-10" width="76" height="34" rx="4" fill="#f4eee2"/>
