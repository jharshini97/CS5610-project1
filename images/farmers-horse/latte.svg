    <path d="M-30 -30Q-30 20 -20 40" stroke="#f6d28c" stroke-width="6" fill="none" opacity="0.6"/>
  </g>
  <!-- dipper -->
  <path d="M480 520L560 580" stroke="#8a5a35" stroke-width="8" stroke-linecap="round"/>
  <g fill="#c9a358"><ellipse cx="470" cy="512" rx="20" ry="14" transform="rotate(37 470 512)"/></g>
  <path d="M458 502L482 522M464 496L488 516" stroke="#8a6a3a" stroke-width="3"/>
