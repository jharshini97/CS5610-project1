  <g>
    <rect x="130" y="470" width="90" height="55" rx="6" fill="#e2c58a"/>
    <path d="M130 485H220M130 510H220" stroke="#c9a358" stroke-width="3"/>
    <path d="M160 470V525M190 470V525" stroke="#8a6a3a" stroke-width="3"/>
    <path d="M600 470Q590 500 600 530H660Q670 500 660 470Z" fill="#8a5a35"/>
    <path d="M594 482H666M594 518H666" stroke="#3b2a20" stroke-width="4"/>
  </g>
</svg>
