<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t1">Illustrated farmhouse-style storefront of Farmers Horse Coffee at golden hour</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a6c9"/>
      <stop offset="0.55" stop-color="#f1c6a0"/>
      <stop offset="1" stop-color="#f7dfb4"/>
    </linearGradient>
    <pattern id="batten" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect width="26" height="10" fill="#f4eee2"/>
      <rect width="5" height="10" fill="#e2d8c5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#dusk)"/>
  <circle cx="160" cy="250" r="55" fill="#f9e3a8"/>
  <!-- hills -->
  <path d="M0 330Q160 250 330 310T800 290V600H0Z" fill="#a7a56a"/>
  <path d="M0 380Q220 320 450 370T800 350V600H0Z" fill="#7d8450"/>
  <g transform="translate(40 232) scale(0.7)"><g fill="#3b2a20"><ellipse cx="50" cy="40" rx="34" ry="13"/><path d="M72 34L90 6L99 9L90 42Z"/><path d="M90 3L111 14L107 20L94 15Z"/><path d="M91 5L93 -3L96 5Z"/><path d="M24 48L20 76H25L31 50Z"/><path d="M36 50L37 76H42L42 50Z"/><path d="M62 50L60 76H65L68 50Z"/><path d="M74 46L80 76H85L80 44Z"/><path d="M18 34Q4 42 6 64Q14 50 20 42Z"/><path d="M88 8Q80 18 76 34L80 34Q84 20 92 10Z" fill="#2a1d16"/></g></g>
  <!-- fence -->
  <g stroke="#6b4a2e" stroke-width="5">
    <path d="M0 440H180M0 465H180M20 425V485M80 425V485M140 425V485"/>
    <path d="M620 440H800M620 465H800M640 425V485M700 425V485M760 425V485"/>
  </g>
  <!-- farmhouse -->
  <path d="M220 250L400 145L580 250Z" fill="#4a3526"/>
  <rect x="240" y="250" width="320" height="250" fill="url(#batten)"/>
  <path d="M230 250L400 150L570 250" fill="none" stroke="#3b2a20" stroke-width="10" stroke-linejoin="round"/>
  <!-- loft window -->
  <circle cx="400" cy="210" r="22" fill="#f6d28c" stroke="#4a3526" stroke-width="6"/>
  <path d="M400 188V232M378 210H422" stroke="#4a3526" stroke-width="3"/>
  <!-- hanging sign -->
  <path d="M250 268H550" stroke="#3b2a20" stroke-width="6"/>
  <path d="M290 268V282M510 268V282" stroke="#3b2a20" stroke-width="3"/>
  <rect x="270" y="282" width="260" height="42" rx="4" fill="#6b4a2e"/>
  <text x="400" y="310" text-anchor="middle" font-family="Rockwell, 'Courier New', Georgia, serif" font-size="18" font-weight="bold" textLength="228" lengthAdjust="spacingAndGlyphs" fill="#f7dfb4">farmers horse coffee</text>
  <!-- barn door -->
  <rect x="345" y="355" width="110" height="145" fill="#6f7a45"/>
  <path d="M345 355L455 500M455 355L345 500" stroke="#f4eee2" stroke-width="7"/>
  <rect x="345" y="355" width="110" height="145" fill="none" stroke="#f4eee2" stroke-width="7"/>
  <path d="M330 347H470" stroke="#3b2a20" stroke-width="6"/>
  <!-- windows with boxes -->
  <g>
    <rect x="262" y="350" width="62" height="80" fill="#f6d28c" stroke="#4a3526" stroke-width="5"/>
    <path d="M293 350V430M262 390H324" stroke="#4a3526" stroke-width="3"/>
    <rect x="476" y="350" width="62" height="80" fill="#f6d28c" stroke="#4a3526" stroke-width="5"/>
    <path d="M507 350V430M476 390H538" stroke="#4a3526" stroke-width="3"/>
    <rect x="256" y="430" width="74" height="18" fill="#6b4a2e"/><rect x="470" y="430" width="74" height="18" fill="#6b4a2e"/>
    <g fill="#d9795f"><circle cx="268" cy="428" r="6"/><circle cx="288" cy="424" r="6"/><circle cx="310" cy="428" r="6"/><circle cx="484" cy="428" r="6"/><circle cx="506" cy="424" r="6"/><circle cx="526" cy="428" r="6"/></g>
    <g fill="#e2c58a"><circle cx="278" cy="422" r="4"/><circle cx="300" cy="420" r="4"/><circle cx="496" cy="422" r="4"/><circle cx="518" cy="420" r="4"/></g>
  </g>
  <!-- ground -->
  <rect y="500" width="800" height="100" fill="#c9a86e"/>
  <path d="M0 500H800" stroke="#a88a52" stroke-width="4"/>
