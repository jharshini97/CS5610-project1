<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t1">Illustrated minimalist storefront of Ogawa Coffee with a noren curtain</title>
  <defs>
    <pattern id="slats" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="14" height="10" fill="#dcbd8c"/>
      <rect width="3" height="10" fill="#b89560"/>
    </pattern>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9a0"/>
      <stop offset="1" stop-color="#c98f4e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#ebe6de"/>
  <circle cx="640" cy="120" r="70" fill="#e7a38a"/>
  <!-- building -->
  <rect x="100" y="150" width="600" height="350" fill="#f7f4ee"/>
  <rect x="80" y="138" width="640" height="18" fill="#2b2a28"/>
  <!-- slat panel -->
  <rect x="125" y="185" width="210" height="315" fill="url(#slats)"/>
  <!-- sign plank -->
  <rect x="400" y="185" width="260" height="42" fill="#3a2e24"/>
  <text x="530" y="213" text-anchor="middle" font-family="Futura, 'Century Gothic', 'Trebuchet MS', Helvetica, sans-serif" font-size="20" letter-spacing="7" fill="#f7f4ee">ogawa coffee</text>
  <!-- doorway -->
  <rect x="420" y="250" width="220" height="250" fill="url(#warm)"/>
  <rect x="420" y="250" width="220" height="250" fill="none" stroke="#2b2a28" stroke-width="8"/>
  <path d="M530 250V500" stroke="#2b2a28" stroke-width="4"/>
  <!-- noren -->
  <rect x="412" y="246" width="236" height="8" fill="#6b4a2e"/>
  <g fill="#26345a">
    <rect x="420" y="254" width="70" height="96"/><rect x="495" y="254" width="70" height="96"/><rect x="570" y="254" width="70" height="96"/>
  </g>
  <circle cx="530" cy="298" r="22" fill="none" stroke="#f7f4ee" stroke-width="6"/>
  <!-- lantern -->
  <path d="M370 156V232" stroke="#2b2a28" stroke-width="2"/>
  <rect x="356" y="232" width="28" height="7" fill="#2b2a28"/>
  <ellipse cx="370" cy="270" rx="26" ry="32" fill="#f3c77e"/>
  <path d="M346 258H394M345 270H395M346 282H394" stroke="#d9a55a" stroke-width="2"/>
  <rect x="356" y="300" width="28" height="7" fill="#2b2a28"/>
  <!-- gravel with raked lines -->
  <rect y="500" width="800" height="100" fill="#dcd6cc"/>
  <g fill="none" stroke="#c6bfb3" stroke-width="2">
    <path d="M0 520H800M0 540H800M0 560H800M0 580H800"/>
  </g>
  <g fill="#9a958d">
    <ellipse cx="530" cy="515" rx="50" ry="10"/><ellipse cx="500" cy="548" rx="48" ry="11"/><ellipse cx="535" cy="583" rx="52" ry="12"/>
  </g>
  <!-- pine in stone planter -->
  <g>
    <rect x="200" y="455" width="80" height="50" fill="#8d8a84"/>
    <rect x="195" y="450" width="90" height="10" fill="#77746f"/>
    <path d="M240 450C235 420 255 400 240 370C230 350 250 330 265 320" fill="none" stroke="#2b2a28" stroke-width="10" stroke-linecap="round"/>
    <path d="M242 395C215 390 195 380 180 370" fill="none" stroke="#2b2a28" stroke-width="6" stroke-linecap="round"/>
    <g fill="#3e5b45">
      <ellipse cx="270" cy="312" rx="55" ry="16"/><ellipse cx="180" cy="362" rx="40" ry="13"/><ellipse cx="262" cy="365" rx="36" ry="12"/>
    </g>
  </g>
</svg>
