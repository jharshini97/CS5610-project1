<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t2">Illustrated latte in a speckled ceramic cup on a wooden tray over a wave pattern</title>
  <defs>
    <pattern id="wave" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#26345a"/>
      <g fill="#26345a" stroke="#3d5080" stroke-width="2.5">
        <circle cx="30" cy="15" r="28"/><circle cx="30" cy="15" r="19" fill="none"/><circle cx="30" cy="15" r="10" fill="none"/>
        <circle cx="0" cy="30" r="28"/><circle cx="0" cy="30" r="19" fill="none"/><circle cx="0" cy="30" r="10" fill="none"/>
        <circle cx="60" cy="30" r="28"/><circle cx="60" cy="30" r="19" fill="none"/><circle cx="60" cy="30" r="10" fill="none"/>
      </g>
    </pattern>
    <radialGradient id="crema" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c98f4e"/>
      <stop offset="1" stop-color="#8a5530"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wave)"/>
  <!-- tray -->
  <rect x="150" y="215" width="500" height="290" rx="18" fill="#000" opacity="0.25" transform="translate(8 10)"/>
  <rect x="150" y="215" width="500" height="290" rx="18" fill="#d6b27e"/>
  <rect x="168" y="233" width="464" height="254" rx="10" fill="#e3c393"/>
  <g stroke="#cfa872" stroke-width="2" fill="none">
