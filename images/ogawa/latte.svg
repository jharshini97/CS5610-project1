  </g>
  <path d="M350 305V342" stroke="#c98f4e" stroke-width="2"/>
  <!-- sugar dish -->
  <ellipse cx="545" cy="410" rx="55" ry="17" fill="#000" opacity="0.15"/>
  <ellipse cx="545" cy="402" rx="55" ry="17" fill="#f7f4ee"/>
  <ellipse cx="545" cy="400" rx="42" ry="11" fill="#ebe6de"/>
  <g fill="#ffffff" stroke="#d8d2c7" stroke-width="1.5">
