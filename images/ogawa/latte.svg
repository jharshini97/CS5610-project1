  <path d="M255 320Q260 420 290 435Q350 452 410 435Q440 420 445 320Z" fill="#3a3836"/>
  <path d="M443 345Q495 345 492 380Q488 410 440 405" fill="none" stroke="#3a3836" stroke-width="14" stroke-linecap="round"/>
  <g fill="#8f8a84">
    <circle cx="290" cy="360" r="2.5"/><circle cx="320" cy="395" r="2"/><circle cx="370" cy="372" r="2.5"/><circle cx="405" cy="410" r="2"/>
    <circle cx="420" cy="360" r="2"/><circle cx="345" cy="420" r="2.5"/><circle cx="300" cy="415" r="2"/><circle cx="390" cy="345" r="2"/>
  </g>
  <ellipse cx="350" cy="320" rx="95" ry="30" fill="#4a4744"/>
