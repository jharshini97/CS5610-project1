<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t3">Illustrated interior of a workshop-style coffee lounge</title>
  <defs>
    <pattern id="brick2" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#8a4a33"/>
      <path d="M0 0H40M0 10H40M10 0V10M30 10V20" stroke="#6b3726" stroke-width="2"/>
    </pattern>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf7e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6cf7e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#brick2)"/>
  <!-- ceiling beam -->
  <rect width="800" height="40" fill="#3a3f42"/>
  <path d="M0 40H800" stroke="#2b2b2b" stroke-width="4"/>
