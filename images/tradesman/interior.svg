    <circle cx="290" cy="210" r="3"/><circle cx="330" cy="210" r="3"/><circle cx="370" cy="210" r="3"/><circle cx="410" cy="210" r="3"/><circle cx="450" cy="210" r="3"/><circle cx="480" cy="210" r="3"/>
  </g>
  <g>
    <rect x="300" y="120" width="10" height="70" fill="#6b4a2e"/><rect x="288" y="115" width="34" height="18" fill="#3a3f42"/>
    <path d="M350 120L350 195" stroke="#3a3f42" stroke-width="8"/><circle cx="350" cy="125" r="12" fill="none" stroke="#3a3f42" stroke-width="6"/>
    <rect x="390" y="125" width="60" height="16" fill="#3a3f42"/><rect x="395" y="141" width="10" height="45" fill="#b08d4a"/>
    <path d="M470 120V195" stroke="#9aa0a3" stroke-width="6"/><path d="M462 190H478" stroke="#b08d4a" stroke-width="10"/>
  </g>
  </g>
